<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0A192F" />
  <title>Advantage Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body,#root{height:100%;margin:0;padding:0;background:#0A192F;color:#E2E8F0;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:manipulation}
    a{color:inherit;text-decoration:none}
    input{font:inherit;color:inherit;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:.75rem;width:100%}
    input:focus{outline:none;border-color:#CCFF00}
    .glass{background:rgba(255,255,255,.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12)}
    .score-mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
    .btn{min-width:44px;min-height:44px;border-radius:12px;font-weight:600;transition:all .15s;user-select:none;cursor:pointer;border:none;display:inline-flex;align-items:center;justify-content:center;font-family:inherit;padding:0 1rem}
    .btn:active{transform:scale(.95)}.btn:disabled{opacity:.5;cursor:not-allowed}
    .btn-primary{background:#CCFF00;color:#0A192F;box-shadow:0 0 12px rgba(204,255,0,.45)}
    .btn-outline{border:2px solid #CCFF00;color:#CCFF00;background:transparent}
    .btn-danger{background:#FF4D4D;color:#fff}
    .btn-ghost{background:rgba(255,255,255,.1);color:#fff}
    .btn-chip{min-width:44px;min-height:44px;border-radius:8px;padding:.5rem .75rem;font-size:.875rem;font-weight:500;border:1px solid rgba(255,255,255,.2);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);color:rgba(255,255,255,.8)}
    .btn-chip:active{transform:scale(.95)}
    .btn-chip.active{background:#CCFF00;color:#0A192F;border-color:#CCFF00;box-shadow:0 0 12px rgba(204,255,0,.45)}
    .wrap{max-width:32rem;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
    .header{position:sticky;top:0;z-index:20;padding:.75rem 1rem;border-bottom:1px solid rgba(255,255,255,.1)}
    .footer{position:sticky;bottom:0;z-index:20;padding:.75rem 1rem;border-top:1px solid rgba(255,255,255,.1);display:flex;gap:.5rem}
    .main{flex:1;padding:1rem;overflow-y:auto}
    .row{display:flex;gap:.5rem;align-items:center}
    .col{display:flex;flex-direction:column;gap:.75rem}
    .space{height:.5rem}
    .muted{color:#94a3b8;font-size:.75rem}
    .title{font-size:1.5rem;font-weight:700}
    .neon{color:#CCFF00}
    .cyan{color:#00F0FF}
    .err{color:#FF4D4D}
    .card{border-radius:12px;padding:1rem}
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:1rem}
    .modal{border-radius:16px;padding:1.5rem;width:100%;max-width:24rem}
    table{width:100%;border-collapse:collapse;font-size:.75rem}
    th,td{padding:.4rem .5rem;text-align:left;border-top:1px solid rgba(255,255,255,.05)}
    th{color:#94a3b8;background:rgba(255,255,255,.05)}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
    svg.court{width:100%;max-width:20rem;touch-action:none}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "zustand": "https://esm.sh/zustand@5.0.2",
      "dexie": "https://esm.sh/dexie@4.0.11"
    }
  }
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
